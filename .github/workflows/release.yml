name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to point at main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test on the lowest and highest supported PHP
        run: |
          for php in 7.4 8.5; do
            docker run --rm --network none -v "$PWD:/app:ro" -w /app "php:${php}-cli" php tests/run.php
          done

      # The exact archive Composer downloads for this version.
      - name: Download the distribution archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/zipball/${GITHUB_SHA}" > "webhooks-php-${GITHUB_REF_NAME}.zip"
          sha256sum "webhooks-php-${GITHUB_REF_NAME}.zip" | tee SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: webhooks-php-${{ github.ref_name }}.zip

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md \
            "webhooks-php-${GITHUB_REF_NAME}.zip" SHA256SUMS
