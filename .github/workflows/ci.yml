name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: composer:2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      # Checkout runs on the host, which has git; inside a PHP image it would fall
      # back to an archive download that honours export-ignore and drops tests/.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint and test on the official PHP image
        run: >-
          docker run --rm --network none -v "$PWD:/app:ro" -w /app php:${{ matrix.php }}-cli
          sh -ec 'for f in $(find src tests -name "*.php"); do php -l "$f"; done; php tests/run.php'
